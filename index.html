    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #1a7dab;
      --blue-dark: #0d5c80;
      --blue-light: #e8f4f9;
    }

    body {
      font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--blue);
    }

    /* ── Top header with logo ── */
    .header {
      width: 100%;
      background: #fff;
      padding: 28px 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header img {
      width: 100%;
      max-width: 380px;
      height: auto;
    }

    /* ── Main content ── */
    .content {
      width: 100%;
      max-width: 480px;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Headline ── */
    .headline {
      text-align: center;
      padding: 20px 0 24px;
    }

    .headline h2 {
      font-size: 18px;
      font-weight: 400;
      color: var(--blue);
      line-height: 1.4;
      letter-spacing: 0.2px;
    }

    /* ── Location sections ── */
    .location-section {
      width: 100%;
      margin-bottom: 20px;
    }

    .location-label {
      font-family: 'Comfortaa', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--blue);
      opacity: 0.6;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    /* ── Team photo ── */
    .team-photo-wrap {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(26,125,171,0.12);
    }

    .team-photo-wrap img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ── Book button ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-family: 'Comfortaa', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.3px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 16px rgba(26,125,171,0.28);
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(26,125,171,0.2);
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-city {
      font-size: 17px;
      font-weight: 400;
    }

    .btn-sub {
      font-size: 11px;
      opacity: 0.75;
      letter-spacing: 0.5px;
    }

    .btn-arrow {
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(26,125,171,0.15), transparent);
      margin: 4px 0 24px;
    }

    /* ── Footer ── */
    .footer {
      font-size: 11px;
      color: var(--blue);
      opacity: 0.35;
      text-align: center;
      padding: 0 0 20px;
      font-family: 'Comfortaa', sans-serif;
    }
  </style>
</head>
